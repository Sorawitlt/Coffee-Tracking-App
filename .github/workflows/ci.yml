name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # ขั้น 10: Lighthouse (A11y/Best Practices/SEO ≥ 90) + axe WCAG 2.2 AA ทุกหน้าจอ สว่าง/มืด + PWA ออฟไลน์
  # ใช้ Google Chrome ที่ติดตั้งมากับ runner · รายงานฉบับเต็มดาวน์โหลดได้จาก Artifacts ของ run
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .audit/
          if-no-files-found: ignore
